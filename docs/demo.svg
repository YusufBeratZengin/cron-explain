<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="title desc">
  <title id="title">cron-explain terminal demo</title>
  <desc id="desc">A real CLI command explains a weekday schedule in English and lists ten future runs in UTC from a fixed start date. The full transcript is available in the README.</desc>
  <rect width="960" height="504" rx="16" fill="#0d1117"/>
  <path d="M16 0H944Q960 0 960 16V48H0V16Q0 0 16 0" fill="#161b22"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="6" fill="#febc2e"/>
  <circle cx="68" cy="24" r="6" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" xml:space="preserve">
    <text x="480" y="29" text-anchor="middle" fill="#8b949e">cron-explain · UTC · en</text>
    <text x="32" y="86" fill="#7ee787">$ cron-explain &quot;*/15 9-17 * * 1-5&quot; --next 10 --tz UTC --lang en --start 2026-10-23T08:00:00Z</text>
    <text x="32" y="110" fill="#e6edf3"></text>
    <text x="32" y="134" fill="#e6edf3">Expression: */15 9-17 * * 1-5</text>
    <text x="32" y="158" fill="#e6edf3">Explanation: Every 15 minutes, between 09:00 and 17:59, on Monday through Friday</text>
    <text x="32" y="182" fill="#e6edf3">Time Zone: UTC</text>
    <text x="32" y="206" fill="#e6edf3"></text>
    <text x="32" y="230" fill="#e6edf3">Next 10 run times:</text>
    <text x="32" y="254" fill="#e6edf3">1. 2026-10-23 09:00:00 (+00:00)</text>
    <text x="32" y="278" fill="#e6edf3">2. 2026-10-23 09:15:00 (+00:00)</text>
    <text x="32" y="302" fill="#e6edf3">3. 2026-10-23 09:30:00 (+00:00)</text>
    <text x="32" y="326" fill="#e6edf3">4. 2026-10-23 09:45:00 (+00:00)</text>
    <text x="32" y="350" fill="#e6edf3">5. 2026-10-23 10:00:00 (+00:00)</text>
    <text x="32" y="374" fill="#e6edf3">6. 2026-10-23 10:15:00 (+00:00)</text>
    <text x="32" y="398" fill="#e6edf3">7. 2026-10-23 10:30:00 (+00:00)</text>
    <text x="32" y="422" fill="#e6edf3">8. 2026-10-23 10:45:00 (+00:00)</text>
    <text x="32" y="446" fill="#e6edf3">9. 2026-10-23 11:00:00 (+00:00)</text>
    <text x="32" y="470" fill="#e6edf3">10. 2026-10-23 11:15:00 (+00:00)</text>
  </g>
</svg>
